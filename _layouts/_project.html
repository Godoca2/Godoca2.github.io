---
layout: default
---
<article class="project">
<h1>{{ page.title }}</h1>
{% if page.cover %}
<img class="cover" src="{{ page.cover }}" alt="{{ page.title }}">
{% endif %}


{% if page.badges %}
<p>
{% for b in page.badges %}
<img alt="badge" src="https://img.shields.io/badge/{{ b | replace: ' ', '%20' }}-informational"/>
{% endfor %}
</p>
{% endif %}


{{ content }}


{% if page.repo %}
<p><a class="btn" href="{{ page.repo }}" target="_blank">Ver repositorio</a></p>
{% endif %}
</article>
