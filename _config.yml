# ─────────────────────────────────────────────
# César Godoy Delaigue — Technical Profile
# ─────────────────────────────────────────────

title: "César Godoy Delaigue"
description: "Data Scientist · Data Engineer · GIS"
tagline: "Diseño e implemento plataformas de datos, sistemas de IA y soluciones de inteligencia geoespacial."
url: "https://godoca2.github.io"
baseurl: ""
lang: "es"

# ── Social ──
linkedin: "https://www.linkedin.com/in/cesar-godoy-delaigue/"
email: "cgodoy.delaigue@gmail.com"
github: "https://github.com/Godoca2"

# ── Build ──
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# ── Collections ──
collections:
  solutions:
    output: true
    permalink: /solutions/:name/
  case-studies:
    output: true
    permalink: /case-studies/:name/

# ── Defaults ──
defaults:
  - scope:
      path: ""
      type: solutions
    values:
      layout: solution
  - scope:
      path: ""
      type: case-studies
    values:
      layout: case-study
  - scope:
      path: ""
    values:
      layout: page

# ── SEO ──
seo:
  name: "César Godoy Delaigue"
  type: "Person"

# ── Exclude ──
exclude:
  - README.md
  - MAINTENANCE.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor


